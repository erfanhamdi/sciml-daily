name: daily
on:
  schedule:
    - cron: "12 10 * * *"    # 10:12 UTC (~6:12am ET, EDT) so the digest is ready before 7am. Off the hour: GitHub drops on-the-hour crons under load.
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write             # commit docs/ + data/

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python main.py
      - name: Commit site + state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data
          git commit -m "daily $(date -u +%F)" || echo "no changes"
          git push
